{% extends "base.html" %}{% block content %}<div class="page-title"><p class="eyebrow">PROFİL</p><h1>Profilini yenilə</h1></div><form class="panel form-card" method="post" enctype="multipart/form-data">{% csrf_token %}<label>Profil şəkli<input type="file" name="avatar" accept="image/*"></label><div class="form-grid"><label>Yaş<input name="age" type="number" value="{{request.user.age}}"></label><label>Şəhər<input name="city" value="{{request.user.city}}"></label></div><label>Haqqında<textarea name="bio">{{request.user.bio}}</textarea></label><button class="primary">Yadda saxla</button></form>{% endblock %}
