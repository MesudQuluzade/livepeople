{% extends "base.html" %}{% block content %}<div class="admin-posts-toolbar"><a class="outline" href="/admin-panel/">← Admin</a><span class="muted">{{admin_posts|length}} paylaşım</span></div><section class="panel">{% for post in admin_posts %}<article class="admin-message"><div><b>{{post.author.username}}</b><small>{{post.created_at|date:"d M Y, H:i"}}</small></div><p>{{post.body}}</p><form method="post" action="/admin-panel/posts/{{post.pk}}/delete/" onsubmit="return confirm('Bu paylaşım silinsin?')">{% csrf_token %}<button class="mini-btn danger-btn">Paylaşımı sil</button></form></article>{% empty %}<div class="empty">Paylaşım yoxdur.</div>{% endfor %}</section>{% endblock %}
