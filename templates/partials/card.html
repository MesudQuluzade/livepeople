<article class="person-card"><a href="/profile/{{person.pk}}/" class="photo">{% if person.avatar %}<img src="{{person.avatar.url}}">{% else %}<span>{{person.username|slice:":1"|upper}}</span>{% endif %}<i class="online-dot"></i></a><div class="card-info"><a class="name" href="/profile/{{person.pk}}/">{{person.username}}</a><p>{{person.age}} yaş · {{person.city}}</p><div class="card-foot"><span class="status">● Online</span><a class="message-btn" href="/chat/start/{{person.pk}}/">Mesaj yaz</a></div></div></article>
