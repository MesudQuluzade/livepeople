{% extends "base.html" %}{% block content %}<div class="page-title"><p class="eyebrow">SÖHBƏT OTAĞI</p><h1>{{room.name}}</h1><p class="muted">{{room.description}}</p></div><section class="panel room-chat">{% for m in room.messages.all %}<div class="room-msg"><b>{{m.sender.username}}</b><span>{{m.body}}</span><small>{{m.created_at|date:'H:i'}}</small></div>{% empty %}<div class="empty">İlk mesajı sən yaz.</div>{% endfor %}<form class="message-form" method="post" action="/rooms/send/">{% csrf_token %}<input type="hidden" name="room" value="{{room.pk}}"><input name="body" placeholder="Otağa mesaj yaz..." required><button class="primary">Göndər ↗</button></form></section>{% endblock %}
